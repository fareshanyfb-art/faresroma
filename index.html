#password{position:absolute;inset:0;display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:.7s}.gate.password-mode .envelope-wrap{display:none}.gate.password-mode #password{opacity:1;pointer-events:auto}.pw-card{width:min(90vw,370px);text-align:center}.pw-card .logo{font:600 32px 'Playfair Display',serif;direction:ltr}.pw-card p{color:var(--muted);line-height:1.9;margin:12px 0 22px}.pw-input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:#120d10;color:#fff;outline:none;text-align:center;direction:ltr}.pw-btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#170b10;font-weight:700}.pw-error{height:22px;color:#df7188;font-size:12px;margin-top:7px}

.moments{display:grid;gap:14px}.moment{background:#130e11;border:1px solid var(--line);border-radius:14px;overflow:hidden}.moment img{width:100%;display:block;max-height:330px;object-fit:cover}.moment-body{padding:15px}.moment h3{margin:0 0 5px}.moment-meta{font-size:11px;color:#a9989e}.moment p{font-size:13px;line-height:1.9;color:#cdbec3}.song{text-align:center;padding:28px 18px;border:1px dashed #53303d;border-radius:15px;background:#110c0f}.song .icon{font-size:35px}.song h3{font:600 21px 'Playfair Display',serif;direction:ltr}.song p{color:var(--muted);font-size:13px;line-height:1.8}

.envelopes{display:grid;gap:13px}.open-card{position:relative;overflow:visible;height:160px;padding:0;border:0;border-radius:14px;cursor:pointer;background:transparent;perspective:1000px}.env-mini{position:absolute;inset:13px;border:1px solid #6b3b4c;border-radius:10px;background:linear-gradient(145deg,#3a1c28,#1d1117);overflow:hidden;box-shadow:0 14px 30px #0006;transition:transform .35s}.env-mini:before,.env-mini:after{content:"";position:absolute;bottom:-8px;width:75%;height:100px;background:#2c151f;z-index:1}.env-mini:before{right:-19%;transform:skewX(-39deg)}.env-mini:after{left:-19%;transform:skewX(39deg)}.env-flap{position:absolute;z-index:4;top:0;left:0;width:100%;height:75px;background:#4a202d;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .75s cubic-bezier(.2,.8,.2,1)}.env-seal{position:absolute;z-index:6;left:50%;top:50px;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#d88b9e;box-shadow:0 5px 16px #0008;transition:.35s}.env-label{position:absolute;z-index:7;inset:0;display:grid;place-items:center;padding-top:82px;font:600 15px 'Playfair Display',serif;transition:.35s}.card-paper{position:absolute;z-index:3;left:50%;bottom:14px;width:78%;height:95px;background:var(--paper);color:var(--ink);border-radius:4px;padding:10px 12px;text-align:right;transform:translate(-50%,52px);transition:transform .8s cubic-bezier(.2,.8,.2,1),height .6s,box-shadow .5s;box-shadow:0 10px 25px #0008;opacity:.98}.card-paper small{display:block;color:#806d72;font-size:9px;margin-bottom:3px}.card-paper b{font-size:11px;line-height:1.5;display:block}.open-card:hover .env-mini{transform:translateY(-2px)}.open-card.opening .env-flap{transform:rotateX(175deg)}.open-card.opening .env-seal{opacity:0;transform:translate(-50%,-50%) scale(.35)}.open-card.opening .env-label{opacity:0;transform:translateY(12px)}.open-card.opening .env-mini{transform:translateY(2px)}.open-card.opening .card-pape
